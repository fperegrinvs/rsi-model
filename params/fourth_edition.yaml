      C: 12.0
      N: 4.0
      Cu: 16.0
      Ni: 16.0
      Co: 3.0
      Cr: 8.0
      Li: 3.0
      rare_earths: 2.0
      dopants: 0.8

  lunar_vitamin_bridge:
    description: >
      Lunar bulk-material backbone with a finite Earth vitamin stock; no
      asteroid source within the first replication horizon.
    horizon_years: 20.0
    asteroid_enabled: false
    asteroid_commission_year: 999.0
    ai_level: 1.15
    minimum_task_coverage: 0.76
    remote_intervention_budget_hours_per_year: 2200.0
    earth_import_cutoff_year: 12.0
    earth_import_caps_t:
