      Cu: 20.0
      Ni: 20.0
      Co: 4.0
      Cr: 10.0
      Li: 4.0
      rare_earths: 3.0
      dopants: 1.0

  lunar_strict:
    description: >
      No Earth material stock beyond the physical seed and no asteroid
      source. Trace lunar yields must support every element.
    horizon_years: 25.0
    asteroid_enabled: false
    asteroid_commission_year: 999.0
    ai_level: 1.30
    minimum_task_coverage: 0.82
    remote_intervention_budget_hours_per_year: 1600.0
    earth_import_cutoff_year: 0.0
    earth_import_caps_t: {}

  moon_asteroid_network:
    description: >
      Lunar bulk industry plus a diverse asteroid-source portfolio entering
      after cislunar transport and mining commissioning; no Earth material
      imports after deployment.
    horizon_years: 30.0
