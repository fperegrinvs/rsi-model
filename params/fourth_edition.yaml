scenarios:
  terrestrial_rehearsal:
    description: >
      Stage 0 on Earth using the lunar material/process palette and simulated
      lunar gravity constraints; initial vitamin stocks allowed.
    horizon_years: 12.0
    asteroid_enabled: false
    asteroid_commission_year: 999.0
    ai_level: 1.00
    minimum_task_coverage: 0.70
    remote_intervention_budget_hours_per_year: 3000.0
    earth_import_cutoff_year: 8.0
