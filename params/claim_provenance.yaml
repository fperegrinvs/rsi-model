# Claim-level provenance for every non-ASSUMPTION anchor and each load-bearing
# [S27] strategy claim. This register records source statements, not truth
# guarantees: company targets and interview recollections retain their stated
# source class and are never promoted to demonstrated performance.
#
# `model_value` must match params/anchors.yaml exactly. `status: verified`
# means that the source record, locator, extraction, and transformation were
# checked; it does not mean that a forecast, target, or recollection is true.

anchors:
  delta.wear_space_solar:
    source_class: peer_reviewed
    model_value: {low: 0.004, high: 0.017}
    units: fractional_capacity_loss_per_year
    source_ref: S19
    organization_or_authors: "Whitney Q. Lohmeyer; Raichelle J. Aniceto; Kerri Cahoy; Ashley Carlton"
    title: "Solar array degradation on geostationary communications satellites: the quantification of annual degradation and degradation over solar proton events"
    date: "2018-03-20"
    locator: "International Journal of Space Science and Engineering 5(1), pp. 61-81; abstract and annual-degradation results"
    permanent_url_or_doi: "https://doi.org/10.1504/IJSPACESE.2018.090549"
    extracted_value: "GaAs 0.44%-1.03%/yr; silicon 0.71%-1.69%/yr across telemetry from eleven GEO communications satellites"
    transformation: "Take the union of the reported cell-technology ranges, divide percentages by 100, and round outward to 0.004-0.017 fractional loss/yr."
    status: verified

