context_claims:
  amodei_marginal_returns:
    source_class: company_statement
    units: qualitative_claim
    source_ref: S79
    organization_or_authors: "Dario Amodei"
    title: "Machines of Loving Grace"
    date: "2024-10"
    locator: "Basic assumptions and framework, paragraphs defining the country of geniuses and the five limiting-factor classes"
    permanent_url_or_doi: "https://darioamodei.com/essay/machines-of-loving-grace"
    extracted_value: "The essay frames powerful AI as millions of fast digital workers and asks for marginal returns to intelligence subject to outside-world speed, data, intrinsic complexity, human constraints, and physical law."
    transformation: "Use the limiting-factor taxonomy and humanitarian countercase as a stated CEO framework; keep the copy count, speed, dates, and downstream outcomes as scenario assumptions."
    claim_text: "Marginal returns to intelligence depend on complementary factors and can approach irreducible physical or institutional floors."
    status: verified

  ai2027_scenario_and_revision_boundary:
    source_class: scenario
    units: qualitative_claim
    source_ref: S80
    organization_or_authors: "Daniel Kokotajlo; Scott Alexander; Thomas Larsen; Eli Lifland; Romeo Dean"
    title: "AI 2027 and research supplements"
    date: "2025-04-03; updates through 2025-12"
    locator: "Main scenario introduction and added July/November/December 2025 notes; Takeoff Forecast, Focus on software improvements and milestone definitions"
    permanent_url_or_doi: "https://ai-2027.com/; https://ai-2027.com/research/takeoff-forecast"
    extracted_value: "The authors present one concrete forecast scenario with slowdown and race endings, distinguish software from slower hardware feedback, and later moved a forecast median back while retaining a fast 2027 branch."
    transformation: "Use structural distinctions and the fast branch as sensitivity cases only; do not treat dates, labor multipliers, or compute allocations as measurements."
    claim_text: "AI 2027 is a versioned forecast scenario and stress-test architecture, not established evidence for its headline calendar."
    status: verified

  anthropic_execution_direction_gap:
    source_class: company_statement
    units: qualitative_claim
    source_ref: S81
    organization_or_authors: "Anthropic Institute"
    title: "When AI builds itself"
    date: "2026"
    locator: "Evidence from within Anthropic; research-execution experiment; What might the future of work at Anthropic look like?"
    permanent_url_or_doi: "https://www.anthropic.com/institute/recursive-self-improvement"
    extracted_value: "Anthropic reports high internal code contribution and experimental execution uplift while stating that larger gaps remain in goal selection, research taste, and autonomous successor design."
    transformation: "Treat all quantities as company-reported and potentially selection-, attribution-, evaluator-, and counterfactual-biased; do not convert code share or lines of code into a capability-growth coefficient."
    claim_text: "Frontier-lab self-reports support separating fixed-goal execution from research direction-setting, not declaring full AI-R&D closure."
    status: verified

  trammell_korinek_growth_conditions:
    source_class: technical_report
    units: qualitative_claim
    source_ref: S82
    organization_or_authors: "Philip Trammell; Anton Korinek"
    title: "Economic Growth under Transformative AI"
    date: "2026-04; 2026-06-02"
    locator: "NBER Working Paper 31815 revised April 2026, PDF pp. 2, 5, 20-23; Annual Review of Economics 18, Review in Advance abstract"
    permanent_url_or_doi: "https://doi.org/10.3386/w31815; https://doi.org/10.1146/annurev-economics-051624-061002"
    extracted_value: "Production automation accelerates growth when capital can substitute sufficiently for labor and self-replicate; outcomes depend on saving and depreciation, research parallelizability and returns to scale, substitution, and fixed natural-resource factors. R&D automation alone need not produce explosive growth."
    transformation: "Use as aggregate economic lineage and a conceptual cross-check. Do not transfer its aggregate capital assumptions into the article's sector-balanced off-world closure graph."
    claim_text: "Self-replicating production capital and self-improving knowledge capital are distinct growth mechanisms with different sufficient conditions."
    status: verified

  metr_task_horizon_boundary:
    source_class: technical_report
    units: qualitative_claim
    source_ref: S83
    organization_or_authors: "METR"
    title: "Measuring AI Ability to Complete Long Software Tasks; Clarifying limitations of time horizon"
    date: "2025-03-19; 2026-01-22"
    locator: "2025 Summary and method; 2026 limitations sections on domain, delegation, reliability, and automation"
    permanent_url_or_doi: "https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/; https://metr.org/notes/2026-01-22-time-horizon-limitations/"
    extracted_value: "METR measured a roughly seven-month doubling trend in 50%-success task horizon on its tested distribution, while warning that horizons are domain-specific, are not delegation thresholds, and do not directly determine automation or research speedup."
    transformation: "Use only as measured progress over the tested predominantly software/research distribution; require industrial task, reliability, verifier, and intervention evidence before extrapolating."
    claim_text: "Task-horizon progress does not by itself establish industrial autonomy, economic substitution, or an AI-R&D multiplier."
    status: verified

