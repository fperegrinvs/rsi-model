    source_class: technical_report
    model_value: {low: 0.90, high: 0.96}
    units: fraction_of_required_matter_supplied_internally
    source_ref: S23
    organization_or_authors: "NASA/ASEE 1980 Summer Study"
    title: "Advanced Automation for Space Missions"
    date: "1980"
