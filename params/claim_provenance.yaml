# Claim-level provenance for every non-ASSUMPTION anchor and each load-bearing
# [S27] strategy claim. This register records source statements, not truth
# guarantees: company targets and interview recollections retain their stated
# source class and are never promoted to demonstrated performance.
#
# `model_value` must match params/anchors.yaml exactly. `status: verified`
# means that the source record, locator, extraction, and transformation were
# checked; it does not mean that a forecast, target, or recollection is true.

anchors:
  delta.wear_space_solar:
    source_class: peer_reviewed
    model_value: {low: 0.004, high: 0.017}
    units: fractional_capacity_loss_per_year
    source_ref: S19
    organization_or_authors: "Whitney Q. Lohmeyer; Raichelle J. Aniceto; Kerri Cahoy; Ashley Carlton"
    title: "Solar array degradation on geostationary communications satellites: the quantification of annual degradation and degradation over solar proton events"
    date: "2018-03-20"
    locator: "International Journal of Space Science and Engineering 5(1), pp. 61-81; abstract and annual-degradation results"
    permanent_url_or_doi: "https://doi.org/10.1504/IJSPACESE.2018.090549"
    extracted_value: "GaAs 0.44%-1.03%/yr; silicon 0.71%-1.69%/yr across telemetry from eleven GEO communications satellites"
    transformation: "Take the union of the reported cell-technology ranges, divide percentages by 100, and round outward to 0.004-0.017 fractional loss/yr."
    status: verified

  delta.wear_terrestrial_pv:
    source_class: peer_reviewed
    model_value: {low: 0.005, high: 0.006}
    units: fractional_capacity_loss_per_year
    source_ref: S18
    organization_or_authors: "Dirk C. Jordan; Sarah R. Kurtz; Kaitlyn VanSant; Jeff Newmiller"
    title: "Compendium of Photovoltaic Degradation Rates"
    date: "2016"
    locator: "Progress in Photovoltaics 24(7), pp. 978-989; crystalline-silicon median results"
    permanent_url_or_doi: "https://doi.org/10.1002/pip.2744"
    extracted_value: "Median crystalline-silicon degradation approximately 0.5%-0.6%/yr"
    transformation: "Divide the reported percentage medians by 100; retain the 0.005-0.006 interval without extrapolation."
    status: verified

  energy.pv_epbt_years:
    source_class: peer_reviewed
    model_value: {low: 0.9, high: 4.1}
    units: years
    source_ref: S20
    organization_or_authors: "Fraunhofer ISE (Simon Philipps; Werner Warmuth); Bhandari et al."
    title: "Photovoltaics Report (14 July 2026); Energy pay-back time and carbon footprint of commercial photovoltaic systems"
    date: "2026-07-14; 2015"
    locator: "Fraunhofer Photovoltaics Report p. 8; Renewable and Sustainable Energy Reviews 47, pp. 133-141"
    permanent_url_or_doi: "https://www.ise.fraunhofer.de/content/dam/ise/de/documents/publications/studies/Photovoltaics-Report.pdf; https://doi.org/10.1016/j.rser.2015.02.057"
    extracted_value: "0.9-1.1 years for European installations in the 2026 report; 1.0-4.1 years in the harmonized review"
    transformation: "Take the union of the two reported EPBT intervals; do not reinterpret energy payback as industrial replication."
    status: verified

