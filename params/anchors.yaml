# Anchored parameters — traceable to the paper's Appendix A (Second Edition r2.8).
# Ranges are sampled by Monte Carlo. source_class ∈ {peer_reviewed, technical_report,
# company_statement, reporting, ASSUMPTION}.  Units noted per entry.

delta:  # fractional capacity loss per year, decomposed
  wear_space_solar:        {low: 0.004, high: 0.017, source_class: peer_reviewed,     note: "GEO telemetry, 11 sats (2018); GaAs low, Si high"}
  wear_terrestrial_pv:     {low: 0.005, high: 0.006, source_class: peer_reviewed,     note: "Jordan et al. 2016 median"}
  catastrophic_leo:        {low: 0.001, high: 0.03,  source_class: reporting,         note: "COHORT-DEPENDENT fleet fractions, not hazard rates (r2.11 correction):
    ~3% for early Starlink generations, <0.5% for later ones; tracker mixes early
    deorbit, uncontrolled decay, retirement, disposal. Band spans later-generation
    (~0.5%/5yr) through early-generation annualized"}
  logistics_penalty_space: {low: 0.01,  high: 0.05,  source_class: ASSUMPTION,        note: "internal repair-chain overhead as capacity tax; UNANCHORED"}
  obsolescence_earth_adv:  {low: 0.15,  high: 0.35,  source_class: technical_report,  note: "2-5yr fab tool schedules; 3-6yr accelerator lives"}

design_life_years:
  geo: {value: 15, source_class: technical_report}
  leo: {value: 5,  source_class: reporting}

energy:
  pv_epbt_years:           {low: 0.9, high: 4.1, source_class: peer_reviewed,  note: "Fraunhofer 2026 Europe low end; Bhandari 2015 harmonized high end. Measures ENERGY payback only — NOT industrial replication."}

closure:
  nasa1980_materials_closure: {low: 0.90, high: 0.96, source_class: technical_report, note: "CP-2255 attainable estimate; theoretical"}
  demonstrated_isru_o2_yield: {value: 0.20, source_class: technical_report,           note: "NASA carbothermal TRL 5/6; single output"}
  vitamin_import_fraction:    {low: 0.04, high: 0.10, source_class: technical_report, note: "CP-2255 residual"}
  space_electronics_q_scale:  {low: 0.10, high: 0.30, source_class: ASSUMPTION,       note: "Fraction of the electronics sector's output mix producible off-world
    (the vitamin gap). UNANCHORED — no published measurement exists. Bounding argument:
    UPPER ~0.3 because advanced-node logic/memory (EUV lithography, metrology,
    ultra-pure feedstocks — the Section 13 residual chokepoint) is not locally
    closable in this scenario class, and boards/passives/power electronics are a
    minority of electronics value; LOWER ~0.1 because thick-film PCB, wiring, and
    discrete/power devices are plausibly closable with generic machine tools.
    THE single most results-driving number in Part I — see ROADMAP."}

buildout:
  gigafactory_months: {value: 10, source_class: reporting, note: "Shanghai; PROJECT EXECUTION, not replication"}

# ---------------------------------------------------------------------------
# Part II anchors: levelized-cost mass/power budgets (space vs Earth compute).
# Company TARGETS are evidence of intent, not feasibility (rule 3). They are
# sweep axes except for the separately labeled `starmind_ai1_aspirational`
# deterministic sensitivity below; they never enter the probabilistic baseline.

launch:
  leo_per_kg:           {low: 1400, high: 4000, source_class: company_statement, note: "published price sheets 2024-26: F9 ~$70M/22.8t ≈ $3.0k/kg; FH reusable ~$97M/~63t ≈ $1.4-1.5k/kg. List prices, not costs"}
  cislunar_multiplier:  {low: 2.0,  high: 4.0,  source_class: ASSUMPTION,        note: "$/kg to high orbit / TLI vs LEO; staging + kick stages"}
  lunar_surface_multiplier: {low: 4.0, high: 20.0, source_class: ASSUMPTION,     note: "landed $/kg vs LEO AT SCALE. Today's CLPS missions are ~$1M/kg (100x LEO); range assumes maturing landers. Wide on purpose"}

power_systems:
  pv_specific_power_w_per_kg: {low: 80, high: 150, source_class: technical_report, note: "flexible blanket arrays; ROSA ~150 W/kg BOL at 1 AU, rigid panels low end"}
  pv_cost_per_kw:       {low: 500,  high: 2000, source_class: reporting,          note: "space-qualified array $/kW at volume; terrestrial is ~10x cheaper"}
  radiator_kg_per_kw:   {low: 3.0,  high: 12.0, source_class: technical_report,   note: "deployable radiators at electronics-friendly reject temps; ISS EATCS practice ~6 kg/kW_rejected; advanced concepts 1-3"}
  radiator_cost_per_kw: {low: 200,  high: 1000, source_class: ASSUMPTION,         note: "manufactured cost at volume; UNANCHORED"}
  structure_overhead_fraction: {low: 0.20, high: 0.50, source_class: ASSUMPTION,  note: "bus/harness/avionics/shielding mass as fraction of (hw+pv+radiator) mass"}
  lunar_storage_kg_per_kwh: {low: 4.0, high: 10.0, source_class: technical_report, note: "Li-ion pack-level 100-250 Wh/kg; night-survival storage for lunar surface"}
  infrastructure_life_years: {low: 10.0, high: 25.0, source_class: ASSUMPTION,     note: "amortization life for PV/radiator/storage/structure and the launch spend
    that emplaced them, DISTINCT from the compute refresh cycle (r3.5 review fix:
    a single short compute life over-annualized long-lived infrastructure).
    Bounding: GEO comsat buses design to ~15 yr and ISS EATCS radiators exceed
    20 yr service (upper); LEO debris/UV/thermal-cycling and lunar dust +
    300-K-swing degradation argue the lower end. UNANCHORED within the range"}

compute:
  hw_per_kw_it:         {low: 25000, high: 45000, source_class: reporting,        note: "accelerator+system $ per kW of IT load, 2024-26 (H100 ~0.7 kW ~$25-30k; B200 ~1 kW ~$30-40k incl. system share)"}
  hw_mass_kg_per_kw:    {low: 10,   high: 30,   source_class: ASSUMPTION,         note: "server mass per kW IT stripped of air-cooling chassis; UNANCHORED"}
  space_qual_multiplier: {low: 1.2, high: 3.0,  source_class: ASSUMPTION,         note: "rad-tolerant COTS screening/derating cost factor on hw. Low end has
    reporting-class support: Planet flies unmodified Nvidia GPUs on Pelican imaging
    satellites (in-orbit inference demo April 2026, now standard on the line;
    Moonshots #266, docs/transcripts/moonshots-266-2026-06-26.md) — COTS survives
    benign LEO for inference-class workloads. Suncatcher proton testing
    (arXiv:2511.19468v2, 2026-06-17): TPU v6e HBM most TID-sensitive,
    irregularities from ~2 krad(Si) vs ~750 rad 5-yr shielded requirement
    (~150 rad/yr), no hard TID failures to 15 krad — SUPPORTS 5-yr TID
    survivability with margin and does not contradict 7-yr TID; core logic/SRAM
    most SEE-sensitive, inference error ~1 per 3M inferences, training impact
    reserved. What remains unresolved is SYSTEM reliability (SEE, training
    workloads, thermal, whole-spacecraft). High end (hardened, long-life,
    training-class) remains UNANCHORED"}
  life_years_space:     {low: 3.0,  high: 7.0,  source_class: reporting,          note: "LEO design lives ~5 yr; radiation + obsolescence for compute payloads"}
  life_years_earth:     {low: 3.0,  high: 6.0,  source_class: technical_report,   note: "accelerator refresh cycles (Appendix A: obsolescence-driven)"}
  utilization_leo:      {low: 0.65, high: 0.95, source_class: ASSUMPTION,         note: "eclipse fraction (orbit-dependent; dawn-dusk SSO near 1.0) x availability.
    High end supported by the Suncatcher reference design (81-sat cluster in
    dawn-dusk sun-synchronous orbit, near-continuous sunlight; r2.10 [S32])"}
  utilization_cislunar: {low: 0.90, high: 0.99, source_class: ASSUMPTION,         note: "near-continuous sunlight at high orbit"}
  utilization_lunar:    {low: 0.45, high: 0.85, source_class: ASSUMPTION,         note: "14-day night: low end = solar+partial storage; high end = polar site / oversized storage"}
  ops_fraction_per_year: {low: 0.02, high: 0.06, source_class: ASSUMPTION,        note: "ground segment, downlink, ops as fraction of space capex per year"}
  power_overhead_space: {low: 1.10, high: 1.25, source_class: ASSUMPTION,         note: "conversion + pumping losses; the space analogue of PUE"}

# Starmind AI1 disclosed architecture, SpaceX company page accessed 2026-07-27:
# https://www.spacex.com/spacexai/starmind
# These values define a separate conditional scenario only. They do not replace
# the generic LEO anchors or establish achieved cost, reliability, or lifetime.
starmind:
  compute_payload_kw_peak: {value: 150, source_class: company_statement, note: "AI1 disclosed compute payload peak, kW. CONTEXT: not used as delivered-average model denominator; official Starmind page, accessed 2026-07-27"}
  compute_payload_kw_average: {value: 120, source_class: company_statement, note: "AI1 disclosed average compute payload, kW. USED with solar_array_kw to set the scenario's 1.25 array-power/average-compute ratio; official Starmind page, accessed 2026-07-27"}
  vehicle_efficiency_kw_per_tonne: {value: 70, source_class: company_statement, note: "AI1 disclosed vehicle efficiency, kW/tonne. The page does not state whether kW means peak or average; official Starmind page, accessed 2026-07-27"}
  vehicle_mass_kg_per_average_kw: {low: 14.285714, high: 17.857143, source_class: ASSUMPTION, note: "DERIVED interpretation range from the disclosed 70 kW/tonne and 120 average / 150 peak kW: low assumes the efficiency numerator is average power (1000/70); high assumes it is peak power and converts total vehicle mass to an average-kW denominator ((150/70 t)/120 kW). USED as aggregate launched vehicle mass; the generic component budget supplies only the lifecycle split"}
  solar_array_kw: {value: 150, source_class: company_statement, note: "AI1 disclosed solar-array rating, kW. USED with average compute payload to set the 1.25 design power ratio; official Starmind page, accessed 2026-07-27"}
  solar_power_density_w_per_m2: {value: 250, source_class: company_statement, note: "AI1 disclosed solar power density, W/m^2. CONTEXT ONLY: the cost model prices PV per kW and the aggregate vehicle mass constraint already captures array mass; official Starmind page, accessed 2026-07-27"}
  radiator_area_m2: {value: 110, source_class: company_statement, note: "AI1 disclosed deployable liquid-radiator area, m^2. CONTEXT ONLY: no radiator areal mass or cost is disclosed, so the scenario retains the generic radiator cost and uses the aggregate vehicle mass constraint; official Starmind page, accessed 2026-07-27"}
  deployed_height_m: {value: 20, source_class: company_statement, note: "AI1 disclosed deployed height, m. CONTEXT ONLY; official Starmind page, accessed 2026-07-27"}
  wingspan_m: {value: 70, source_class: company_statement, note: "AI1 disclosed wingspan, m. CONTEXT ONLY; official Starmind page, accessed 2026-07-27"}

# SpaceX long-term targets and the favorable undisclosed values used only by
# `starmind_ai1_aspirational`. Company targets remain company statements, not
# achieved specifications; analyst-selected values remain ASSUMPTIONs.
# Source: SpaceX EU Prospectus approved 2026-06-05, pp. 63, 71-72, 82, 97, 137:
# https://content.spacex.com/cms-assets/FINAL_Documents%20and%20Updates/SpaceX%20-%20EU%20Prospectus%20%28Approved%20by%20Bafin%29%20-%20June%205%2C%202026.pdf
aspirations:
  starship_leo_cost_per_kg: {value: 185, source_class: company_statement, note: "TARGET, not achieved price: exact arithmetic ceiling from SpaceX's aim to reduce its stated historical $18,500/kg launch cost by 99% or more (0.01 x $18,500 = $185/kg). USED only in the aspirational deterministic sensitivity; EU Prospectus 2026-06-05, pp. 63, 70, 137"}
  starmind_vehicle_efficiency_kw_per_tonne: {value: 100, source_class: company_statement, note: "LONG-TERM TARGET/ASSUMPTION in SpaceX scale arithmetic: 100 kW of AI compute per deployed tonne. The later AI1 product page discloses only 70 kW/t, 30% below this target. USED only in the aspirational deterministic sensitivity; EU Prospectus 2026-06-05, p. 82"}
  starmind_vehicle_mass_kg_per_average_kw: {value: 10, source_class: ASSUMPTION, note: "DERIVED exactly as 1000 kg/t divided by the company-target 100 kW/t. USED as aggregate launched mass only in the aspirational deterministic sensitivity"}
  starship_v3_payload_tonnes: {value: 100, source_class: company_statement, note: "DESIGN TARGET: Starship V3 reusable payload capacity to orbit. CONTEXT ONLY for scale arithmetic; EU Prospectus 2026-06-05, pp. 71-72"}
  starship_v4_payload_tonnes: {value: 200, source_class: company_statement, note: "FUTURE TARGET: possible Starship V4 reusable payload capacity to orbit. CONTEXT ONLY for scale arithmetic; EU Prospectus 2026-06-05, pp. 71-72"}
  orbital_compute_gw_per_year: {value: 100, source_class: company_statement, note: "LONG-TERM TARGET: up to 100 GW of AI-compute power deployed to orbit annually. CONTEXT ONLY for scale arithmetic; EU Prospectus 2026-06-05, pp. 82, 97"}
  starmind_qualification_multiplier: {value: 1.2, source_class: ASSUMPTION, note: "FAVORABLE MODEL BOUND, not published by SpaceX: low end of compute.space_qual_multiplier. USED only in the aspirational deterministic sensitivity"}
  starmind_life_years: {value: 7, source_class: ASSUMPTION, note: "FAVORABLE MODEL BOUND, not published by SpaceX: high end of compute.life_years_space. USED only in the aspirational deterministic sensitivity"}
  starmind_utilization: {value: 0.95, source_class: ASSUMPTION, note: "FAVORABLE MODEL BOUND, not achieved AI1 availability: high end of compute.utilization_leo. Starlink's reported network uptime is not evidence of AI1 spacecraft compute availability. USED only in the aspirational deterministic sensitivity"}

earth:
  power_price_kwh:      {low: 0.05, high: 0.12, source_class: reporting,          note: "industrial/DC contracted power 2024-26; tight markets high end"}
  nuclear_ppa_kwh:      {low: 0.09, high: 0.13, source_class: reporting,          note: "restart PPAs (e.g. TMI ~$100-115/MWh reported 2024); long-run firm clean floor"}
  gas_power_price_floor_kwh: {low: 0.04, high: 0.06, source_class: reporting,     note: "firm CCGT power at shale-gas fuel cost + capex + O&M (Situational
    Awareness ch. IIIa, 2024, docs/sources/: <$1000/kW plant capex, ~2yr
    combined-cycle build, Marcellus alone could feed ~150-250 GW). POLITICALLY
    CONDITIONAL: assumes permitting/climate commitments yield — the responsive
    scenario's premise; the tight scenario is the politics-binds branch"}
  gas_power_capex_per_kw: {low: 700, high: 1200, source_class: reporting,         note: "CCGT plant capex basis for the floor above (Situational Awareness
    ch. IIIa: ~$100B per 100 GW). Documentation anchor; not directly consumed"}
  dc_capex_per_kw_it:   {low: 11000, high: 20000, source_class: reporting,        note: "AI-optimized facility $/kW IT 2025-26 ($11-20M/MW); excludes IT hw"}
  pue:                  {low: 1.10, high: 1.40, source_class: reporting,          note: "hyperscale AI facilities"}
  wacc:                 {low: 0.08, high: 0.15, source_class: ASSUMPTION,         note: "capital recovery rate, both sides"}
  older_node_hw_per_kw: {low: 8000, high: 15000, source_class: reporting,         note: "prior-gen accelerators $/kW IT on secondary/extended supply"}
  older_node_energy_penalty: {low: 1.5, high: 3.0, source_class: technical_report, note: "J/FLOP penalty vs frontier node (~2-3x per 2 process generations)"}

# External CLAIMS recorded for comparison against model outputs. NEVER model
# inputs (rule 3: company statements are evidence of intent, not feasibility).
claims:
  google_planet_crossover_launch_per_kg: {low: 200, high: 300, source_class: company_statement, note: "Will Marshall
    (Moonshots #266, 2026-06): a Google/Planet study (~2017-18) concluded orbital
    compute beats terrestrial 'on a pure cost basis' at $200-300/kg LEO; quotes
    Pichai: most compute in space within 10 yr. COMPARISON TARGET ONLY — see the
    external-claim check in outputs/report_part2.md: reproducible in our model only
    under COTS qualification (~1.2x) + ~7yr life + ~0.95 utilization simultaneously"}
  suncatcher_launch_feasibility_per_kg: {value: 200, source_class: technical_report, note: "Google Research
    Project Suncatcher (arXiv:2511.19468v2, 2026-06-17). LAUNCH-COST FEASIBILITY
    MARKER, NOT A CROSSOVER (r2.11 correction — the study says twice it is not a
    full economic analysis): at $200/kg it compares amortized LAUNCH cost per
    kW-yr ($810 Starlink-v2-class; $810-7,500 across classes) against terrestrial
    ELECTRICITY spend ($570-3,000/kW-yr), explicitly excluding infrastructure,
    building, and chip costs. Launch-vs-electricity is not system-vs-system —
    the missing system-level analysis is what lco.py provides. Reaching
    <=$200/kg by ~2035 on a ~20% learning rate needs ~370kt additional
    cumulative mass (~1,800 Starship-class flights). Never a model input"}

# Explicitly absent (unknown; model outputs, never inputs):
