      abstract_max_words: 250
      keywords_min: 1
      keywords_max: 7
      highlights: {required: false, min_items: 0, max_items: 0, max_chars_each: 0}
      numbered_sections: true
      editable_source: true
      reference_style: publisher_flexible_at_initial_submission
      data_statement: encouraged
      separate_title_page: true
