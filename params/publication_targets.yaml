version: r4.0
decision_date: "2026-07-28"
status: venues_selected_conformance_in_progress
source_class: publisher_instructions
epistemic_status: >
  Venue-selection and submission-conformance contract. Publisher requirements
  can change and must be rechecked in the submission portal immediately
  before submission.

papers:
  technical:
    manuscript: papers/TECHNICAL_PAPER_r4.0.md
