      abstract_max_words: 350
      keywords_min: 4
      keywords_max:
      highlights: {required: false, min_items: 0, max_items: 0, max_chars_each: 0}
      numbered_sections: false
      editable_source: true
      reference_style: publisher_style_recheck_required
      data_statement: required
