common_submission_requirements:
  machine_checkable:
    - abstract
    - keywords
    - highlights_when_required
    - numbered_sections_when_required
    - references_and_in_text_citations
    - data_and_code_availability
    - proposition_boundary
  author_confirmation_required:
    - definitive_author_list_and_order
    - affiliations_and_postal_addresses
    - corresponding_author_email
    - CRediT_contributions
    - funding_and_sponsor_role
    - competing_interests
    - acknowledgements
    - generative_AI_use_declaration
    - permission_for_reused_material
    - approval_of_final_submission
  submission_actions:
    - create_anonymized_review_file_when_required
    - create_separate_title_page_when_required
    - export_editable_docx_or_tex
    - upload_separate_figures_and_captions
    - attach_supplement_and_repository_archive
    - recheck_live_portal_requirements
  submission_action_applicability:
    create_anonymized_review_file_when_required: when_anonymized_review
    create_separate_title_page_when_required: when_separate_title_page
    export_editable_docx_or_tex: always
    upload_separate_figures_and_captions: always
    attach_supplement_and_repository_archive: always
    recheck_live_portal_requirements: always

publication_boundary: >
  Venue selection is a recommendation, not submission authority. No paper may
  be marked submission_ready until machine-checkable requirements pass and
  every author-confirmation field is explicitly supplied by the author.
