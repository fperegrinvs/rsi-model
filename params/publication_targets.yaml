    minimum_references: 6
    selected_route: target
    target:
      venue: Acta Astronautica
      article_type: Original research paper
      official_url: https://www.sciencedirect.com/journal/acta-astronautica/publish/guide-for-authors
      rationale: Direct fit for engineering analysis of space-borne and Earth-based systems.
      review: single_anonymized
      abstract_max_words:
      keywords_min: 1
      keywords_max: 6
      highlights: {required: true, min_items: 3, max_items: 5, max_chars_each: 85}
      numbered_sections: true
      editable_source: true
      reference_style: numbered_square_brackets_order_of_appearance
      data_statement: encouraged
      separate_title_page: false
      word_count_min:
      word_count_max:
    fallback:
      venue: New Space
      article_type: Original Article
      official_url: https://journals.sagepub.com/author-instructions/NSP
