milestone_order_branches:
  source_class: ASSUMPTION
  evidence_status: ordering_sensitivity
  boundary: >
    Years are illustrative branch coordinates, not forecasts. They separate
    verified AI-R&D closure, embodied-production closure, Earth and off-world
    reproductive-capital closure, and control readiness so no one milestone
    is inferred from another.
  milestone_definitions:
    ai_rd_closure_year: >
      First year a successor-improvement loop can propose, test,
      independently evaluate, and safely deploy accepted AI-R&D changes.
    embodiment_closure_year: >
      First year controllers satisfy the complete active industrial task cut
      with available sensing, actuation, experiments, and recovery.
    earth_capital_closure_year: >
      First year the terrestrial system can replace and expand every
      indispensable capital stock after depreciation and obsolescence.
    space_capital_closure_year: >
      First year the off-world system can replace and expand every
      indispensable capital stock after depreciation and obsolescence.
    control_readiness_year: >
      First year independent verification, authorization, secure command,
      audit, and stop capacity can govern the applicable capability and
      replication rate.
  branches:
    - name: fast_digital_slow_physical
      digital_speed: fast
      physical_speed: slow
      ai_rd_closure_year: 4.0
      embodiment_closure_year: 12.0
      earth_capital_closure_year: 16.0
      space_capital_closure_year: 26.0
      control_readiness_year: 3.0
      earth_bridge_cost_multiplier: 1.0
    - name: slow_digital_fast_physical
