electronics_closure:
  source_class: ASSUMPTION
  bounding_argument: >
    Tier coefficients are explicit architecture bounds pending measured
    bills of process, shelf-life tests, repair logs, and demonstrated local
    production. They replace use of the inherited scalar electronics
    productivity anchor in integrated-layer conclusions but do not establish
    fab closure.
  tiers:
    interconnects_boards:
      local_producibility_fraction: 0.75
      shelf_life_years: 12.0
      obsolescence_per_year: 0.03
      substitution_route: locally patterned boards and wiring
      measurement_priority: qualified local-board yield and repair life
    passives_power:
      local_producibility_fraction: 0.65
      shelf_life_years: 15.0
      obsolescence_per_year: 0.02
      substitution_route: oversized discrete and power components
      measurement_priority: dielectric and magnetic-material process yield
    sensors_control:
      local_producibility_fraction: 0.45
      shelf_life_years: 10.0
      obsolescence_per_year: 0.05
      substitution_route: redundant mature-node controllers and simple sensors
      measurement_priority: locally repairable control-family coverage
    packaging_test:
      local_producibility_fraction: 0.40
      shelf_life_years: 8.0
      obsolescence_per_year: 0.06
      substitution_route: ceramic packages and reduced-density interposers
      measurement_priority: packaging yield with lunar-compatible consumables
    mature_logic:
      local_producibility_fraction: 0.25
      shelf_life_years: 8.0
      obsolescence_per_year: 0.08
