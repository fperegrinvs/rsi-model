version: integrated-model-1
status: scenario_model
source_class: ASSUMPTION
note: >
  Integrated-model coefficients are transparent scenario assumptions unless a
  source_ref is named. Source references constrain occurrence or composition,
  not recoverable yield, plant performance, reserve status, or economics.

elements:
  - O
  - Si
  - Al
  - Fe
  - Mg
  - Ca
  - Ti
  - H
  - C
  - N
  - Cu
  - Ni
  - Co
  - Cr
  - Li
  - rare_earths
  - dopants

source_yields:
  lunar_regolith:
    source_ref: S51-S55
    note: >
      Recoverable tonnes per tonne of processed regolith. These are
      ASSUMPTION-class recovery yields, deliberately below bulk occurrence
      where occurrence is known. They are not reserve estimates.
    yield_t_per_t_feed:
      O: 0.250
      Si: 0.100
      Al: 0.050
      Fe: 0.020
      Mg: 0.020
      Ca: 0.020
      Ti: 0.003
      H: 0.000050
      C: 0.000050
      N: 0.000020
      Cu: 0.000010
      Ni: 0.000010
      Co: 0.000001
      Cr: 0.001000
      Li: 0.000010
      rare_earths: 0.000050
      dopants: 0.000001
  diverse_asteroid_portfolio:
    source_ref: S56
    note: >
      Composite follow-on source representing multiple carbonaceous and
      metal-rich bodies, not Bennu alone. The source record supports material
      diversity; every numerical yield here is ASSUMPTION-class.
    yield_t_per_t_feed:
      O: 0.120
      Si: 0.080
      Al: 0.010
      Fe: 0.250
      Mg: 0.080
      Ca: 0.010
      Ti: 0.001
      H: 0.030
      C: 0.050
      N: 0.005
      Cu: 0.050
      Ni: 0.100
      Co: 0.010
      Cr: 0.010
      Li: 0.002000
      rare_earths: 0.005000
      dopants: 0.000050

processing:
  lunar_feed_t_per_mining_capacity_year: 2500.0
  lunar_feed_t_per_refining_capacity_year: 1800.0
  asteroid_feed_t_per_mining_capacity_year: 450.0
  asteroid_feed_t_per_transport_capacity_year: 300.0
  process_energy_mwh_per_power_capacity_year: 12000.0
  lunar_energy_mwh_per_t_feed: 2.0
  asteroid_energy_mwh_per_t_feed: 7.0

environment:
  lunar_gravity_g: 0.165
  centrifuge_structural_mass_fraction_at_full_g: 0.16
  centrifuge_parasitic_power_fraction_at_full_g: 0.05
  centrifuge_overhead_composition:
    Fe: 0.60
    Al: 0.35
    Cu: 0.05

process_environment_profiles:
  centrifuge_only:
    source_class: ASSUMPTION
    note: >
      Identity profile used by the published central baseline so the new
      environment diagnostics do not silently recalibrate it.
    effects: {}
  lunar_nominal:
    source_class: ASSUMPTION
    note: >
      Bounded diagnostic for dust, vacuum, reduced convection, traction,
      radiation, and thermal cycling. Multipliers are not measured plant
      performance and require process-specific tests.
    effects:
      power:
        mechanism: radiation and thermal-cycle degradation
        throughput_multiplier: 0.95
        yield_multiplier: 0.98
        depreciation_multiplier: 1.15
        power_demand_multiplier: 1.05
      mining:
        mechanism: abrasive dust and reduced traction
        throughput_multiplier: 0.82
        yield_multiplier: 0.95
        depreciation_multiplier: 1.30
        power_demand_multiplier: 1.10
      refining:
        mechanism: reduced convection and volatile containment
        throughput_multiplier: 0.90
        yield_multiplier: 0.92
        depreciation_multiplier: 1.15
        power_demand_multiplier: 1.12
      robotics:
        mechanism: abrasive dust, vacuum lubrication, and thermal cycling
        throughput_multiplier: 0.88
        yield_multiplier: 0.97
        depreciation_multiplier: 1.25
        power_demand_multiplier: 1.08
      machine_tools:
        mechanism: vacuum welding, seals, lubrication, and calibration drift
        throughput_multiplier: 0.90
        yield_multiplier: 0.94
        depreciation_multiplier: 1.20
        power_demand_multiplier: 1.08
      construction:
        mechanism: low-gravity traction and granular mechanics
        throughput_multiplier: 0.80
        yield_multiplier: 0.95
        depreciation_multiplier: 1.20
        power_demand_multiplier: 1.10
      thermal:
        mechanism: dust fouling and thermal-cycle fatigue
        throughput_multiplier: 0.92
        yield_multiplier: 0.98
        depreciation_multiplier: 1.18
        power_demand_multiplier: 1.08
      process_equipment_metrology:
        mechanism: contamination and calibration drift
        throughput_multiplier: 0.90
        yield_multiplier: 0.90
        depreciation_multiplier: 1.20
        power_demand_multiplier: 1.10
  lunar_adverse:
    source_class: ASSUMPTION
    note: >
      Stress boundary obtained by compounding the nominal mechanisms; not a
      probability distribution or a forecast.
    effects:
      power:
        mechanism: severe radiation and thermal-cycle degradation
        throughput_multiplier: 0.85
        yield_multiplier: 0.92
        depreciation_multiplier: 1.40
        power_demand_multiplier: 1.15
      mining:
        mechanism: severe abrasive dust and traction loss
        throughput_multiplier: 0.60
        yield_multiplier: 0.80
        depreciation_multiplier: 1.80
        power_demand_multiplier: 1.30
      refining:
        mechanism: severe volatile loss and melt-control penalty
        throughput_multiplier: 0.70
        yield_multiplier: 0.75
        depreciation_multiplier: 1.50
        power_demand_multiplier: 1.30
      robotics:
        mechanism: severe dust ingress and vacuum-lubrication failure
        throughput_multiplier: 0.70
        yield_multiplier: 0.85
        depreciation_multiplier: 1.60
        power_demand_multiplier: 1.20
      machine_tools:
        mechanism: vacuum welding and metrology drift
        throughput_multiplier: 0.72
        yield_multiplier: 0.80
        depreciation_multiplier: 1.55
        power_demand_multiplier: 1.20
      construction:
        mechanism: severe low-gravity traction and granular instability
        throughput_multiplier: 0.58
        yield_multiplier: 0.82
        depreciation_multiplier: 1.50
        power_demand_multiplier: 1.25
      thermal:
        mechanism: severe dust fouling and thermal fatigue
        throughput_multiplier: 0.72
        yield_multiplier: 0.90
        depreciation_multiplier: 1.50
        power_demand_multiplier: 1.25
      process_equipment_metrology:
        mechanism: severe contamination and calibration loss
        throughput_multiplier: 0.65
        yield_multiplier: 0.70
        depreciation_multiplier: 1.60
        power_demand_multiplier: 1.30

