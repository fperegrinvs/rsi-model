      physical_speed: fast
      ai_rd_closure_year: 18.0
      embodiment_closure_year: 6.0
      earth_capital_closure_year: 9.0
      space_capital_closure_year: 14.0
      control_readiness_year: 5.0
      earth_bridge_cost_multiplier: 1.0
    - name: fast_digital_fast_physical
      digital_speed: fast
      physical_speed: fast
      ai_rd_closure_year: 4.0
      embodiment_closure_year: 5.0
      earth_capital_closure_year: 7.0
      space_capital_closure_year: 9.0
      control_readiness_year: 3.0
