  bounding_argument: >
    This is a transparent logistics stress model, not a calibrated lunar
    deployment forecast. Packaging and initial-spares fractions are swept in
    the release diagnostics; fixed unloading, site-work, and calibration
    masses prevent the installed seed from being relabeled as delivered mass.
    Rates are deliberately slower than terrestrial heavy-industrial handling
    and must be replaced by a mission design before use as an architecture
    estimate.
