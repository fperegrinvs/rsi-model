name: publication-integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pandoc/actions/setup@v1
        with:
          version: "3.10.1"
      - name: Install locked Python environment
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test
        run: pytest tests/ -q
      - name: Regenerate artifacts and manuscript
        run: |
          python scripts/run_baseline.py
          python scripts/run_part2.py
          python scripts/run_integrated.py
          python scripts/run_deep.py
          python scripts/write_claim_provenance.py
          npm run build:manuscript
          python scripts/write_manifest.py
          python scripts/verify_manifests.py
          python scripts/release_preflight.py --mode candidate
      - name: Reject generated drift
        run: git diff --exit-code -- outputs docs/Recursive_Industrial_Intelligence_r4.0.html
