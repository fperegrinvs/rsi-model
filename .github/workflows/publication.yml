name: manual-publication

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the verified reader site from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  PYTHON_VERSION: "3.13.0"

jobs:
  quality:
    name: Fast quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked environments
        run: |
          uv lock --check
          uv sync --locked --all-groups
          pnpm install --frozen-lockfile
      - name: Check Python quality
        run: pnpm run quality:python
      - name: Check publication sources and configuration
        run: |
          pnpm run check:dependencies
          pnpm run check:ai-rnd-evidence
          pnpm run check:notation
          pnpm run check:figures
          pnpm run check:tables
          pnpm run check:font
          pnpm run check:prose
          pnpm run check:propositions
          pnpm run check:readability
          pnpm run check:markdown
          pnpm run check:yaml
          pnpm run check:actions
          pnpm run check:typescript
          pnpm run test:typescript
      - name: Reject source-path injection
        run: |
          if rg -n 'sys[.]path[.](?:insert|append)' src scripts tests; then
            echo "Maintained Python must import the installed package." >&2
            exit 1
          fi
      - name: Test with branch coverage
        run: pnpm run test:coverage
      - name: Generate release SBOM
        run: pnpm run sbom
      - name: Audit locked dependencies
        run: |
          pnpm audit --audit-level high
          pnpm run audit
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            outputs/quality/coverage.json
            outputs/quality/coverage.xml
            outputs/quality/sbom.cdx.json
            outputs/quality/readability.md
          if-no-files-found: warn

  package:
    name: Build and test distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Build sdist and wheel
        run: uv run --locked rsi-check-package --project-root .
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publication:
    name: Verify committed publication
    needs: [quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: "3.10.1"
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.9.38"
      - name: Install locked environments
        run: |
          uv lock --check
          uv sync --locked --all-groups
          pnpm install --frozen-lockfile
      - name: Install the publication browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify the committed macOS candidate
        run: |
          uv run --locked rsi-verify-manifests --project-root .
          uv run --locked rsi-release-preflight --project-root . --mode candidate
      - name: Build and check the publication
        run: |
          pnpm run check:notation
          pnpm run check:figures
          pnpm run check:tables
          pnpm run check:font
          pnpm run check:prose
          pnpm run check:propositions
          pnpm run check:readability
          pnpm run build:manuscript
          pnpm run build:site
          pnpm run check:site
          pnpm run check:table-rendering
          pnpm run check:table-layout
          pnpm run check:accessibility
          pnpm run check:figure-layout
          pnpm run check:artifact-viewer
          pnpm run check:equation-explanations
          pnpm run check:footnotes
          pnpm run check:math-layout
      - name: Upload publication failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-failure-diagnostics-${{ github.run_id }}
          path: |
            outputs
            docs/Recursive_Industrial_Intelligence_r4.0.md
            docs/Recursive_Industrial_Intelligence_r4.0.html
          if-no-files-found: warn
          retention-days: 7
      - name: Report external-link availability
        continue-on-error: true
        run: pnpm run check:external-links
      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          inputs.deploy_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          inputs.deploy_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.deploy_pages
    needs: publication
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
